
name: Update World Bank GDP data

on:
  schedule:
    - cron: "0 0 15 1,3,5,7,9,11 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wb-gdp-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest World Bank data
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gdp_growth.json data/gdp_growth.csv
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update World Bank GDP indicators"
            git push
          fi
